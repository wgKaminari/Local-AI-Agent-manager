name: Release

# Pushing a version tag (for example v0.7.1) publishes a GitHub release.
# The installer and the app's updater install the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install -r requirements.txt
      - name: Run tests
        env:
          JOB_AGENT_KEYRING: "off"
        run: xvfb-run -a python -m unittest discover -s tests
      - name: Test a fresh install from this commit
        run: |
          git archive --format=zip --prefix=PersonalJobAgent/ -o source.zip HEAD
          bash install.sh --source-zip source.zip --tag "$GITHUB_REF_NAME" --install-root "$RUNNER_TEMP/PersonalJobAgent" --quiet --no-shortcuts --no-launch --gui none
          "$RUNNER_TEMP/PersonalJobAgent/venv/bin/python" "$RUNNER_TEMP/PersonalJobAgent/app/run.py" --help

  release:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import norway_job_agent; print(norway_job_agent.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Test a fresh install from this commit
        shell: powershell
        run: |
          git archive --format=zip --prefix=PersonalJobAgent/ -o source.zip HEAD
          .\install.ps1 -SourceZip source.zip -Tag $env:GITHUB_REF_NAME -InstallRoot "$env:RUNNER_TEMP\PersonalJobAgent" -Quiet -NoShortcuts -NoLaunch
          & "$env:RUNNER_TEMP\PersonalJobAgent\venv\Scripts\python.exe" "$env:RUNNER_TEMP\PersonalJobAgent\app\run.py" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --prefix=PersonalJobAgent/ -o "PersonalJobAgent-$GITHUB_REF_NAME.zip" HEAD
          gh release create "$GITHUB_REF_NAME" "PersonalJobAgent-$GITHUB_REF_NAME.zip" install.ps1 install.sh \
            --title "Personal Job Agent $GITHUB_REF_NAME" --generate-notes

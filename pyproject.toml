[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norway-job-agent"
version = "0.1.0"
description = "A personal job discovery and application preparation assistant for Norway."
requires-python = ">=3.12"
dependencies = ["pypdf>=6.18,<7"]

[project.scripts]
norway-jobs = "norway_job_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
